workflows:
  subtrack-ios:
    name: SubTrack iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: SubTrack App Store Connect
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.Dome.subtrack
      vars:
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
      xcode: latest
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Add iOS platform
        script: |
          npx cap add ios
      - name: Sync Capacitor
        script: |
          npx cap sync ios
      - name: Build iOS app
        script: |
          xcodebuild -workspace "$XCODE_WORKSPACE" -scheme "$XCODE_SCHEME" -configuration Release -sdk iphoneos -archivePath build/SubTrack.xcarchive archive
    artifacts:
      - build/SubTrack.xcarchive
