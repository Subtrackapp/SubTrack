
workflows:
  subtrack-ios:
    name: SubTrack iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: SubTrack

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.Dome.subtrack

      vars:
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App

      xcode: latest

    
scripts:
  - name: Install dependencies
    script: |
      set -e
      npm install
      test -x node_modules/.bin/cap

  - name: Prepare web assets
    script: |
      set -e
      mkdir -p www
      cp index.html www/

  - name: Add iOS platform
    script: |
      set -e
      npx cap add ios

  - name: Sync Capacitor
    script: |
      set -e
      npx cap sync ios
          
      - name: Configure code signing
        script: |
          set -e
          xcode-project use-profiles

      - name: Build iOS app
        script: |
          set -e
          xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/SubTrack.xcarchive \
            archive

    artifacts:
      - build/SubTrack.xcarchive
